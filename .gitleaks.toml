#
# gitleaks configuration (CI job "secrets"). The default rule set stays on; only the three
# documented false-positive shapes below are allowed, each scoped to one rule and to the paths
# that hold it. A hit anywhere else fails the job.
title = "tracer gitleaks config"

[extend]
useDefault = true

# SHA-256 digests of model and tokenizer files in fixture provenance records are matched by
# generic-api-key. They are public file digests, not credentials.
[[allowlists]]
description = "file digests in fixture provenance.json"
targetRules = ["generic-api-key"]
paths = ['''^packages/evalschema/tests/fixtures/(real|synthetic)/[^/]+(/[^/]+)?/provenance\.json$''']

# The credential-shape table in the placeholder tests holds PEM header lines only (no key
# material); the evidence logs under docs/phase1/evidence echo those test lines on a failure.
# The allowlist needs both the path and the match shape (condition = "AND"). The match must
# start with a PEM private-key header followed by a quote, a dash or a bracket (as the echoed
# table row, label line and test id are), and no line of it may hold a run of more than 40
# base64 characters. A pasted key body is made of such runs (PEM lines are 64 or 76 characters),
# so it does not fit and is still reported.
[[allowlists]]
description = "PEM header literals in the credential-shape test and its echoed output"
condition = "AND"
targetRules = ["private-key"]
regexTarget = "match"
paths = [
  '''^packages/evalschema/tests/test_entity_base\.py$''',
  '''^docs/phase1/evidence/(green|red)/[^/]+/[^/]+\.log$''',
]
regexes = [
  '''(?i)\A-----BEGIN (?:RSA )?PRIVATE KEY-----['"\]-](?:[A-Za-z0-9+/=]{0,40}[^A-Za-z0-9+/=\n])*[A-Za-z0-9+/=]{0,40}(?:\n(?:[A-Za-z0-9+/=]{0,40}[^A-Za-z0-9+/=\n])*[A-Za-z0-9+/=]{0,40})*\z''',
]

# The key-reference hardening tests keep a table of deliberately fake key=value samples
# (for example a short api_key pair); the file holds no real credential.
[[allowlists]]
description = "synthetic key=value samples in the key-reference test support module"
targetRules = ["generic-api-key"]
paths = ['''^packages/evalschema/tests/_support_b16\.py$''']

# The batch G evidence logs echo pytest failure reprs of the test environment, which holds the
# fixed canary key of the key-handling tests (a made-up string with this prefix, not a
# credential). Scoped to the evidence logs, to generic-api-key and to the canary shape.
[[allowlists]]
description = "canary key echoed in phase 3 evidence logs"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "match"
paths = ['''^docs/phase3/evidence/(green|red)/[^/]+/[^/]+\.(log|txt)$''']
regexes = ['''['"]CANARYKEY-[a-z0-9]{6,8}-[a-z0-9]{6}['"]\z''']
