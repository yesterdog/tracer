[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "tracer-evalschema"
version = "0.0.1"
description = "Pydantic models and JSON Schema for Tracer voice-AI evaluation entities."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic==2.14.1",
    "rfc8785==0.1.4",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[tool.hatch.build]
# Generated JSON Schema files and their lock (P1-15, ADR 0008 Decision 7) are committed package
# data under src/tracer_evalschema/schemas/ and ship byte for byte in the wheel and the sdist
# (checked by test_schema_lock.py). Listed as artifacts so an ignore rule can never drop them.
artifacts = [
    "src/tracer_evalschema/schemas/*.schema.json",
    "src/tracer_evalschema/schemas/schema.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracer_evalschema"]

[tool.hatch.build.targets.sdist]
# The sdist ships no tests (A25, superseding the sdist half of A23; ADR 0008 Decision 7). It
# holds the package source with the committed schemas and lock, README.md, LICENSE and NOTICE
# (also named by license-files above), SCHEMA_POLICY.md and CHANGELOG.md (the policy and the
# release notes describe the distributed package, A30) and this pyproject.toml (always added by
# hatchling; hatchling also adds PKG-INFO and the repository's .gitignore, A27). The policy and
# the changelog are sdist-only: the wheel carries the package code and data only. The
# tests need the repository (tests/fixtures/real, tests/support, scripts/, docs/, the root
# pyproject.toml), so verification runs from the git checkout. The wheel stays test-free (P1-21).
# Neither archive ever carries the test-only clean-room UAX #9 reference (P1-04e), the captured
# provider responses (tests/fixtures/real) or the private call data (tests/fixtures/private).
only-include = [
    "src/tracer_evalschema",
    "README.md",
    "LICENSE",
    "NOTICE",
    "SCHEMA_POLICY.md",
    "CHANGELOG.md",
]
