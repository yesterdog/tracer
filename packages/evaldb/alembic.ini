# Alembic configuration for the command line:
#   alembic -c packages/evaldb/alembic.ini -x url=<database URL> upgrade head
# The file holds no database URL and no credential; the programmatic API (tracer_evaldb.migrate)
# never reads it.
[alembic]
script_location = %(here)s/src/tracer_evaldb/migrations
