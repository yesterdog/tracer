# Copyright 2026 The Tracer contributors
#
# License policy enforced by scripts/check_licenses.py. See docs/security/P1-02-licenses.md.
# Metadata order: License-Expression, then License, then classifiers. Classifiers alone never
# clear a package. An override or exception applies only to the exact name and version and only
# while the pinned license file has the recorded SHA-256; a version bump re-triggers review.

[allowlist]
# "A OR B" passes if one side is allowed; "A AND B" needs every side allowed.
spdx = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "PSF-2.0",
    "Unicode-3.0",
    "0BSD",
]

[runtime]
# Frozen runtime closure of tracer-evalschema (from uv.lock). Any change must be a conscious edit.
closure = [
    "annotated-types",
    "pydantic",
    "pydantic-core",
    "rfc8785",
    "typing-extensions",
    "typing-inspection",
]
# Exact Requires-Dist of the built wheel/sdist (no extras, nothing test-only).
requires_dist = ["pydantic>=2.11,<3", "rfc8785>=0.1.4,<0.2"]

[runtime.evaldb]
# Runtime closure of tracer-evaldb (docs/security/P2-02-licenses.md). The workspace package
# tracer-evalschema is excluded; its closure is the [runtime] table above. The [postgres] extra is
# listed separately. Any change must be a conscious edit.
closure = [
    "alembic",
    "annotated-types",
    "mako",
    "markupsafe",
    "pydantic",
    "pydantic-core",
    "rfc8785",
    "sqlalchemy",
    "typing-extensions",
    "typing-inspection",
]
extras_postgres = [
    "asn1crypto",
    "pg8000",
    "python-dateutil",
    "scramp",
    "six",
    "tzdata",
]
# Requires-Dist of the built wheel, compared as normalised requirements (specifier order is free).
requires_dist = [
    "tracer-evalschema==0.0.1",
    "sqlalchemy>=2.1.6,<3",
    "alembic>=1.20.1,<2",
    "pg8000>=1.31.5,<2; extra == 'postgres'",
]

[runtime.evalcore]
# Runtime closure of tracer-evalcore (docs/security/P3-02-licenses.md). Workspace packages are
# excluded. Standard library plus tracer-evalschema only; a new third-party dependency is a
# conscious edit.
closure = [
    "annotated-types",
    "pydantic",
    "pydantic-core",
    "rfc8785",
    "typing-extensions",
    "typing-inspection",
]
requires_dist = ["tracer-evalschema==0.0.1"]

[runtime.evalproviders]
# Runtime closure of tracer-evalproviders: the evalschema closure plus httpx and its dependencies.
# certifi is MPL-2.0 (see [[exceptions]]); sniffio is not required by the locked anyio.
closure = [
    "annotated-types",
    "anyio",
    "certifi",
    "h11",
    "httpcore",
    "httpx",
    "idna",
    "pydantic",
    "pydantic-core",
    "rfc8785",
    "typing-extensions",
    "typing-inspection",
]
requires_dist = [
    "tracer-evalschema==0.0.1",
    "tracer-evalcore==0.0.1",
    "httpx>=0.28.1,<1",
]

[runtime.cli]
# Runtime closure of tracer-cli: the union of the evalschema, evaldb base, httpx and evalsim
# (websockets) closures. No extra is declared (the Postgres driver is not part of the command
# line).
closure = [
    "alembic",
    "annotated-types",
    "anyio",
    "certifi",
    "h11",
    "httpcore",
    "httpx",
    "idna",
    "mako",
    "markupsafe",
    "pydantic",
    "pydantic-core",
    "rfc8785",
    "sqlalchemy",
    "typing-extensions",
    "typing-inspection",
    "websockets",
]
requires_dist = [
    "tracer-evalschema==0.0.1",
    "tracer-evalcore==0.0.1",
    "tracer-evalproviders==0.0.1",
    "tracer-evaldb==0.0.1",
    "tracer-evalsim==0.0.1",
]

[runtime.evalsim]
# Runtime closure of tracer-evalsim (docs/security/P4-02-licenses.md). Workspace members excluded.
# websockets (BSD-3-Clause) on top of the evalschema closure; protobuf dropped 2026-10-27 (E-b: the
# protobuf dialect is hand-written, ADR 0026 rule 3). The [webrtc] extra is
# listed in [runtime.evalsim.extras_webrtc]. Any change must be a conscious edit.
closure = [
    "annotated-types",
    "pydantic",
    "pydantic-core",
    "rfc8785",
    "typing-extensions",
    "typing-inspection",
    "websockets",
]
# Bounds fixed by P4-01 (lower bound tested on the lowest-direct leg, D3). Reviewed at websockets
# 17.3 and aiortc 1.15.0; the licence of the lowest versions is re-read when a bound is raised.
requires_dist = [
    "tracer-evalschema==0.0.1",
    "tracer-evalcore==0.0.1",
    "websockets>=15.0,<18",
    "aiortc>=1.15.0,<2; extra == 'webrtc'",
]

[runtime.evalsim.extras_webrtc]
# Packages added by the [webrtc] extra beyond [runtime.evalsim]. typing-extensions is already in the
# base closure. pyee has two locked versions (13.0.1 below Python 3.12, 16.0.0 from 3.12). av
# bundles an FFmpeg stack with GPL and LGPL parts: see [[bundled_notices]] and the review, section 4.
closure = [
    "aioice",
    "aiortc",
    "av",
    "cffi",
    "cryptography",
    "dnspython",
    "google-crc32c",
    "ifaddr",
    "pycparser",
    "pyee",
    "pylibsrtp",
    "pyopenssl",
]

# ---------------------------------------------------------------------------------------------
# Rejected: packages considered and refused. Recorded so that nobody adds them without a decision.
# ---------------------------------------------------------------------------------------------

[[rejected]]
name = "psycopg"
spdx = "LGPL-3.0-only"
reason = "Copyleft (LGPL-3.0-only); the Postgres driver is pg8000 (BSD-3-Clause). See docs/security/P2-02-licenses.md."

[[rejected]]
name = "psycopg-binary"
spdx = "LGPL-3.0-only"
reason = "The binary distribution of psycopg, with the same LGPL-3.0-only licence."

[[rejected]]
name = "sarvamai"
spdx = "none declared"
reason = "PyPI declares no licence (license and license_expression null, no classifier). The Sarvam adapter uses the documented REST interface through httpx. See docs/security/P3-02-licenses.md."

[[rejected]]
name = "requests"
spdx = "Apache-2.0"
reason = "Not a licence rejection: a second HTTP stack beside the decided httpx that adds charset_normalizer and urllib3. See docs/security/P3-02-licenses.md."

[[rejected]]
name = "pipecat-ai"
spdx = "BSD-2-Clause"
reason = "Not a rejection of its own licence. As a runtime dependency its core closure pulls num2words (LGPL), soxr 1.0.0 (LGPL-2.1-or-later), soundfile wheels that bundle libsndfile (LGPL-2.1), numba, onnxruntime and weekly releases; it would break test_no_lgpl_or_gpl_in_lock and the frozen closures, and its sarvam extra pins sarvamai==0.1.28 (rejected). Pipecat lives only in tools/samplebot with its own lock, pinned exactly (1.14.0), never in a tracer wheel and never in uv.lock. See docs/security/P4-02-licenses.md."

